<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kranti Siddhaganesh | Portfolio Coming Soon</title>
  <meta name="description" content="The portfolio of Kranti Siddhaganesh is currently being updated and will be available soon.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F7FB;
      color: #1F2937;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .container { max-width: 46rem; }

    .icon {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 2rem;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: clamp(1.05rem, 2.5vw, 1.4rem);
      line-height: 1.7;
      color: #6B7280;
    }

    p + p { margin-top: 1.75rem; }

    .button {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.9rem 2rem;
      background: #111827;
      color: #FFFFFF;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 999px;
    }

    footer {
      margin-top: 4.5rem;
      font-size: 1rem;
      color: #9CA3AF;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon { animation: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon" aria-hidden="true">🚀</div>

    <h1>Thank You for Visiting!</h1>

    <p>My portfolio is currently being updated and will be available soon.</p>
    <p>In the meantime, thank you for your interest, and I look forward to connecting with you.</p>

    <div class="button">Portfolio Coming Soon</div>

    <footer>&copy; <span id="year"></span> Kranti Siddhaganesh</footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
